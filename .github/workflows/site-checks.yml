name: Site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check market.js
          node --check meme.js
          node --check script.js
          node --check froggy-world.js
          node --check i18n.js
          node --input-type=module --check < community.js
      - name: Check required launch pages and safety gates
        run: |
          test -s index.html
          test -s the-swamp.html
          test -s create.html
          test -s froggy-world.html
          test -s froggy-world.css
          test -s i18n.js
          test -s supabase/migrations/20261126000300_community_display_names.sql
          grep -q 'i18n.js' index.html
          grep -q 'i18n.js' the-swamp.html
          grep -q 'i18n.js' create.html
          grep -q 'i18n.js' team.html
          grep -q 'i18n.js' hq.html
          grep -q 'i18n.js' froggy-world.html
          grep -q 'emailAuthReady: false' community-config.js
          grep -q 'turnstileSiteKey' community-config.js
          grep -q 'display_name' supabase/migrations/20261126000300_community_display_names.sql
          grep -q "status text not null default 'pending'" supabase/migrations/20261126000100_chillfrog_community.sql
